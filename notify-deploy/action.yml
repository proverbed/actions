name: Notify Telegram — Deploy
description: Send a Telegram message on production deploy success or failure.

inputs:
  token:
    description: Telegram bot token (TELEGRAM_BOT_TOKEN)
    required: true
  chat_id:
    description: Telegram chat ID (TELEGRAM_CHAT_ID)
    required: true
  status:
    description: "Job status — pass job.status from the caller workflow"
    required: true
  label:
    description: Human-readable deploy label (e.g. "Cloud Functions", "Hosting")
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Plain curl rather than a Docker-based action: container actions only run on
    # Linux runners, and callers also run on self-hosted macOS runners.
    - name: Send Telegram notification
      shell: bash
      env:
        TG_TOKEN: ${{ inputs.token }}
        TG_CHAT_ID: ${{ inputs.chat_id }}
        STATUS: ${{ inputs.status }}
        LABEL: ${{ inputs.label }}
        JOB: ${{ github.job }}
        REPO: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ "$STATUS" = "success" ]; then icon="✅"; else icon="❌"; fi
        if [ -n "$LABEL" ]; then what="Deploy: $LABEL"; else what="Job: $JOB"; fi
        message=$(printf '%s *%s*\n%s\nRef: `%s`\nBy: %s\n%s' \
          "$icon" "$REPO" "$what" "$REF_NAME" "$ACTOR" "$RUN_URL")
        curl --silent --show-error --fail-with-body \
          "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TG_CHAT_ID}" \
          --data-urlencode "parse_mode=Markdown" \
          --data-urlencode "text=${message}" \
          > /dev/null
